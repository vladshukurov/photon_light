name: Quality and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      # Программный Vulkan от Mesa: WebGL в тестах считается на нём, а не на медленном
      # для раннера SwiftShader (см. playwright.config.ts).
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends mesa-vulkan-drivers
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: photon-dist
          path: dist/
